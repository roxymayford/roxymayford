<svg viewBox="0 0 1000 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141126" />
      <stop offset="100%" stop-color="#09101f" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>

    <!-- Shadow for Title -->
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="16" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="260" cy="70" r="110" fill="#9333EA" opacity="0.3" filter="url(#glow-blur)"/>
  <circle cx="740" cy="150" r="120" fill="#EC4899" opacity="0.25" filter="url(#glow-blur)"/>
  <circle cx="500" cy="50" r="90" fill="#06B6D4" opacity="0.2" filter="url(#glow-blur)"/>

  <!-- Floating Math Elements (Subtle Background) -->
  <g font-family="'Cambria Math', 'Times New Roman', serif" font-size="28" fill="rgba(255,255,255,0.06)" font-weight="300">
    <text x="50" y="60">∇</text>
    <text x="120" y="140" font-size="34">∫</text>
    <text x="80" y="210">λ</text>
    <text x="280" y="55">f(x) = σ(Wᵀx + b)</text>
    <text x="880" y="65" font-size="36">∑</text>
    <text x="910" y="155">∞</text>
    <text x="730" y="60">argmin L(θ)</text>
    <text x="790" y="210">e^{iπ} + 1 = 0</text>
  </g>

  <!-- Waving Paths -->
  <path d="M 0,180 C 200,220 400,150 600,195 C 800,230 900,170 1000,190 L 1000,240 L 0,240 Z" fill="url(#wave-1)"/>
  <path d="M 0,200 C 250,165 450,225 700,185 C 850,165 950,210 1000,205 L 1000,240 L 0,240 Z" fill="url(#wave-2)"/>
  <path d="M 0,218 C 300,195 550,230 800,210 C 900,200 960,220 1000,218 L 1000,240 L 0,240 Z" fill="rgba(9, 13, 22, 0.7)"/>

  <!-- Main Title -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="500" y="105" font-size="52" font-weight="900" letter-spacing="-0.5" fill="url(#title-grad)" filter="url(#text-shadow)">
      Roxy Mayford
    </text>

    <!-- Badges Row -->
    <!-- Badge 1: Vibe Code LARPER -->
    <g transform="translate(195, 132)">
      <rect width="180" height="32" rx="16" fill="rgba(236, 72, 153, 0.12)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2"/>
      <text x="90" y="21" font-size="12.5" font-weight="700" fill="#F472B6" letter-spacing="0.5">🎭 VIBE CODE LARPER</text>
    </g>

    <!-- Badge 2: Machine Learning -->
    <g transform="translate(390, 132)">
      <rect width="195" height="32" rx="16" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2"/>
      <text x="97.5" y="21" font-size="12.5" font-weight="700" fill="#C084FC" letter-spacing="0.5">🤖 MACHINE LEARNING</text>
    </g>

    <!-- Badge 3: Math Obsessed -->
    <g transform="translate(600, 132)">
      <rect width="175" height="32" rx="16" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.2"/>
      <text x="87.5" y="21" font-size="12.5" font-weight="700" fill="#38BDF8" letter-spacing="0.5">📐 MATH OBSESSED</text>
    </g>
  </g>
</svg>
