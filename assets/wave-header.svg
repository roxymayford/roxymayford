<svg
  width="100%"
  height="200"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 854 200"
>
  <defs>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#feac5e" />
      <stop offset="50%" stop-color="#c779d0" />
      <stop offset="100%" stop-color="#4bc0c8" />
    </linearGradient>
  </defs>

  <!-- Waving Gradient Animation (Transparent Background) -->
  <g transform="translate(427, 100) scale(1, 1) translate(-427, -100)">
    <path d="" fill="url(#wave-gradient)" opacity="0.45">
      <animate
        attributeName="d"
        dur="18s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcmod="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="0s"
        values="M0 0L 0 130Q 213.5 170 427 140T 854 165L 854 0 Z;M0 0L 0 155Q 213.5 170 427 150T 854 140L 854 0 Z;M0 0L 0 170Q 213.5 145 427 175T 854 140L 854 0 Z;M0 0L 0 130Q 213.5 170 427 140T 854 165L 854 0 Z"
      />
    </path>
    <path d="" fill="url(#wave-gradient)" opacity="0.45">
      <animate
        attributeName="d"
        dur="18s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcmod="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="-9s"
        values="M0 0L 0 145Q 213.5 190 427 160T 854 170L 854 0 Z;M0 0L 0 160Q 213.5 130 427 130T 854 150L 854 0 Z;M0 0L 0 155Q 213.5 135 427 160T 854 175L 854 0 Z;M0 0L 0 145Q 213.5 190 427 160T 854 170L 854 0 Z"
      />
    </path>
  </g>

  <!-- Clean, Normal Typography (No 3D / No Overdone Shadow) -->
  <text
    x="50%"
    y="36%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="46"
    font-weight="700"
    fill="#FFFFFF"
  >Roxy Mayford</text>

  <text
    x="50%"
    y="60%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="19"
    font-weight="500"
    fill="#FFFFFF"
  >Vibe Code LARPER | ML &amp; Math Obsessed</text>
</svg>
