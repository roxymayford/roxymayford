<svg viewBox="0 0 1000 110" width="100%" height="110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#121024" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="footer-wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="footer-wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="110" rx="14" fill="url(#footer-bg)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Top Waving Paths -->
  <path d="M 0,35 C 200,10 400,50 600,20 C 800,45 900,15 1000,30 L 1000,0 L 0,0 Z" fill="url(#footer-wave-1)"/>
  <path d="M 0,25 C 250,55 450,10 700,40 C 850,20 950,45 1000,25 L 1000,0 L 0,0 Z" fill="url(#footer-wave-2)"/>

  <!-- Footer Text -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="500" y="68" font-size="14.5" font-weight="500" fill="#94A3B8" letter-spacing="0.3">
      ✨ <tspan fill="#F1F5F9" font-style="italic">"Code with intuition, learn with conviction, let math &amp; vibes guide the model."</tspan> — <tspan font-weight="700" fill="#C084FC">Roxy Mayford</tspan>
    </text>
  </g>
</svg>
